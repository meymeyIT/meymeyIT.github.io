<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found | Rin Reaksmey</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    /* Same colours as css/style.css */
    :root { --accent: #c6f432; --bg: #0d0d0d; --text: #e8e6e1; --muted: #8c8a85; --border: #363636; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center;
      background: var(--bg) radial-gradient(rgba(255,255,255,0.07) 1px, transparent 1px) 0 0 / 28px 28px;
      color: var(--text); font-family: "Poppins", system-ui, sans-serif;
    }
    .code { font-family: "JetBrains Mono", monospace; font-size: clamp(5rem, 20vw, 9rem); font-weight: 700; line-height: 1; color: transparent; -webkit-text-stroke: 1px var(--border); }
    .code span { color: var(--accent); -webkit-text-stroke: 0; }
    h1 { font-size: clamp(1.5rem, 4vw, 2.2rem); margin: 18px 0 8px; }
    p { color: var(--muted); max-width: 420px; margin: 0 auto 28px; }
    .cmd { font-family: "JetBrains Mono", monospace; font-size: 0.85rem; color: var(--muted); margin-bottom: 26px; }
    .cmd b { color: var(--accent); font-weight: 400; }
    a { display: inline-block; padding: 13px 26px; border-radius: 50px; background: var(--accent); color: #0d0d0d; font-weight: 600; text-decoration: none; transition: transform 0.3s; }
    a:hover { transform: translateY(-3px); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <div class="code">4<span>0</span>4</div>
    <h1>This page doesn't exist</h1>
    <p>The link may be broken or the page may have moved.</p>
    <div class="cmd">&gt; cd <b>~/home</b></div>
    <a href="/">Back to the portfolio</a>
  </main>
</body>
</html>
